name: Build MeshSense Windows

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            api/webbluetooth/package-lock.json
            ui/package-lock.json
            api/package-lock.json
            electron/package-lock.json

      - name: Install and build webbluetooth
        shell: pwsh
        run: |
          cd api/webbluetooth
          npm install
          npm run build:all

      - name: Update dependencies
        shell: pwsh
        run: node update.mjs

      - name: Build app
        shell: pwsh
        run: node build.mjs

      - name: Upload API dist
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: api/dist
          if-no-files-found: warn

      - name: Upload Electron dist
        uses: actions/upload-artifact@v4
        with:
          name: electron-dist
          path: electron/dist
          if-no-files-found: warn
